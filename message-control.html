<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | Message Control</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; width: 100%; margin-top: 10px; margin-bottom: 20px; }
        .control-grid button { width: 100%; margin: 0; }
        .btn-danger { border-color: #ff3366 !important; color: #ff3366 !important; }
        .btn-warning { border-color: #FF9800 !important; color: #FF9800 !important; }
        
        .contact-form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; margin-top: 15px;}
        .contact-form input { flex: 1 1 100%; padding: 12px; background: rgba(0,0,0,0.5); color: #00E5FF; border: 1px solid #8892b0; border-radius: 4px; box-sizing: border-box; font-size: 1.1rem; text-align: center; font-weight: bold; letter-spacing: 2px;}
    </style>
</head>
<body>

    <header class="topbar">
        <a href="master-control.html" class="btn-tactical" style="width: auto; padding: 5px 10px; margin: 0; max-width: none;">⬅️ BACK</a>
        <div class="topbar-logo"><h2>MESSAGE CONTROL</h2></div>
        <div class="topbar-account" style="display: flex; gap: 15px; align-items: center;">
            <span id="userEmail" style="color: #00E5FF;">VERIFYING...</span>
            <button onclick="terminateSession()" style="background: transparent; border: 1px solid #ff3366; color: #ff3366; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;">LOGOUT</button>
        </div>
    </header>

    <main class="dashboard-content" style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
        
        <section class="glass-panel" style="border-color: #FF9800;">
            <h3 style="color: #FF9800;">📡 OFFLINE SMS PAYLOAD GENERATOR</h3>
            <p class="subtitle">Generate encrypted SMS commands if the target device loses internet connectivity. (Uses your phone's native SMS app)</p>

            <div class="contact-form">
                <input type="number" id="offlineTargetPhone" placeholder="TARGET PHONE NUMBER">
            </div>

            <h4 style="color: #66FCF1; margin-top: 10px; width: 100%; text-align: left;">Tracking & Security</h4>
            <div class="control-grid">
                <button onclick="generateSMS('GET_LOCATION')" class="btn-tactical" style="border-color: #00E5FF; color: #00E5FF;">📍 PING RADAR</button>
                <button onclick="generateSMS('LOCK_ACCESSIBILITY')" class="btn-tactical btn-danger">🔒 INSTANT LOCK</button>
            </div>

            <h4 style="color: #ff3366; margin-top: 20px; width: 100%; text-align: left;">Siren Controls (Trigger & Defuse)</h4>
            <div class="control-grid">
                <button onclick="generateSMS('ALARM_ON')" class="btn-tactical btn-warning">🚨 TRIGGER SIREN</button>
                <button onclick="generateSMS('ALARM_OFF')" class="btn-tactical">🔇 DISARM SIREN</button>
            </div>

            <h4 style="color: #ff3366; margin-top: 20px; width: 100%; text-align: left;">Strobe Controls (Trigger & Defuse)</h4>
            <div class="control-grid">
                <button onclick="generateSMS('FLASH_BLINK')" class="btn-tactical btn-warning">🔦 STROBE FLASH</button>
                <button onclick="generateSMS('FLASH_OFF')" class="btn-tactical">🔦 FLASH OFF</button>
            </div>
        </section>

    </main>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI", 
            authDomain: "sentinel-vault-fb4b7.firebaseapp.com", 
            projectId: "sentinel-vault-fb4b7", 
            appId: "1:192301825793:web:734530705f4084608fe500" 
        };
        
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('userEmail').innerText = "AGENT: " + user.email.split('@')[0].toUpperCase();
            } else {
                window.location.href = 'index.html'; 
            }
        });

        function generateSMS(command) {
            const targetPhone = document.getElementById('offlineTargetPhone').value.trim();
            if (!targetPhone) return alert("Enter the target device's phone number first!");
            
            const secretPin = "1234"; 
            const payload = `RAKSHA:${secretPin}:${command}`;
            
            window.location.href = `sms:${targetPhone}?body=${encodeURIComponent(payload)}`;
        }

        function terminateSession() {
            firebase.auth().signOut().then(() => window.location.href = 'index.html');
        }
    </script>
</body>
</html>
