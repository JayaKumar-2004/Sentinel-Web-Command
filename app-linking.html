<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | App Linking</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        .tactical-input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: rgba(16, 24, 32, 0.8); color: #00E5FF;
            border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 6px;
            font-family: 'Share Tech Mono', monospace; font-size: 1rem;
            text-align: center; letter-spacing: 2px;
        }
        .tactical-input::placeholder { color: #8892b0; letter-spacing: normal; }
        .tactical-input:focus { outline: none; border: 1px solid #00E5FF; box-shadow: 0 0 10px rgba(0,229,255,0.3); }

        .device-card {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
            transition: 0.3s;
        }
        .device-card:hover { border-color: rgba(0, 229, 255, 0.5); }
        
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .device-title { color: #00E5FF; font-weight: bold; font-size: 1.2rem; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
        
        .device-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .status-active { color: #00E676; border: 1px solid #00E676; background: rgba(0, 230, 118, 0.1); }
        .status-suspended { color: #FF9800; border: 1px solid #FF9800; background: rgba(255, 152, 0, 0.1); }

        .device-info { color: #8892b0; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.6; }
        
        .device-actions { display: flex; gap: 10px; }
        .device-actions button { margin-bottom: 0; padding: 8px; font-size: 0.8rem; flex: 1; }
    </style>
</head>
<body>

    <div class="rolling-header">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            🔴 RAKSHA-SURAKSHA : DEVICE SYNCHRONIZATION AND LINKING MODULE ACTIVE 🔴
        </marquee>
    </div>

    <header class="topbar">
        <a href="dashboard.html" class="btn-tactical" style="width: auto; padding: 5px 10px; margin: 0; max-width: none;">⬅️ BACK</a>
        <div class="topbar-logo"><h2>APP LINKING</h2></div>
        <div class="topbar-account" id="userEmail" style="color: #00E5FF;">VERIFYING...</div>
    </header>

    <main class="dashboard-content" style="max-width: 800px;">
        
        <section class="glass-panel">
            <h3>🔗 LINK NEW DEVICE</h3>
            <p class="subtitle">Enter the 6-digit pairing code displayed on your Raksha-Suraksha mobile app.</p>
            
            <input type="text" id="pairingCode" class="tactical-input" placeholder="e.g. 849-204" maxlength="7">
            
            <button onclick="linkNewDevice()" class="btn-tactical" style="width: 100%; max-width: 100%;">
                SECURELY LINK DEVICE
            </button>
            <p id="linkMessage" style="color: #00E676; font-size: 0.85rem; margin-top: 10px; display: none;">Device Linked Successfully!</p>
        </section>

        <section class="glass-panel" style="display: block;">
            <h3 style="text-align: center; margin-bottom: 20px;">📱 MANAGED DEVICES</h3>
            
            <div id="deviceContainer"></div>
        </section>

    </main>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI", 
            authDomain: "sentinel-vault-fb4b7.firebaseapp.com", 
            projectId: "sentinel-vault-fb4b7", 
            storageBucket: "sentinel-vault-fb4b7.firebasestorage.app", 
            messagingSenderId: "192301825793", 
            appId: "1:192301825793:web:734530705f4084608fe500" 
        };
        firebase.initializeApp(firebaseConfig);
        
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('userEmail').innerText = "AGENT: " + user.email.split('@')[0].toUpperCase();
            } else {
                window.location.href = 'index.html'; 
            }
        });

        // ONLY THE REAL MASTER NODE
        let linkedDevices = [
            { id: 1, name: "Redmi Y3 (Master Node)", os: "Android", sync: "LIVE", status: "active" }
        ];

        function renderDevices() {
            const container = document.getElementById('deviceContainer');
            container.innerHTML = ""; 

            if (linkedDevices.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#8892b0;'>No devices linked to this account.</p>";
                return;
            }

            linkedDevices.forEach(device => {
                const isActive = device.status === 'active';
                const statusClass = isActive ? 'status-active' : 'status-suspended';
                const statusText = isActive ? '🟢 ACTIVE' : '🟠 SUSPENDED';
                const toggleBtnText = isActive ? '⏸️ SUSPEND ACCESS' : '▶️ RESTORE ACCESS';
                const toggleBtnColor = isActive ? '#FF9800' : '#00E676';

                const cardHtml = `
                    <div class="device-card" id="device-${device.id}">
                        <div class="device-header">
                            <span class="device-title">${device.name}</span>
                            <span class="device-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="device-info">
                            OS Version: ${device.os}<br>
                            Last Sync: ${device.sync}
                        </div>
                        <div class="device-actions">
                            <button onclick="toggleDeviceStatus(${device.id})" class="btn-tactical" style="border-color: ${toggleBtnColor}; color: ${toggleBtnColor};">
                                ${toggleBtnText}
                            </button>
                            <button onclick="deleteDevice(${device.id})" class="btn-tactical" style="border-color: #ff3366; color: #ff3366;">
                                🗑️ REVOKE & DELETE
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function toggleDeviceStatus(id) {
            const device = linkedDevices.find(d => d.id === id);
            if (device) {
                device.status = device.status === 'active' ? 'suspended' : 'active';
                renderDevices(); 
            }
        }

        function deleteDevice(id) {
            const confirmDelete = confirm("CRITICAL WARNING: Are you sure you want to permanently revoke this device's access to the Sentinel network?");
            if (confirmDelete) {
                linkedDevices = linkedDevices.filter(d => d.id !== id);
                renderDevices(); 
            }
        }

        function linkNewDevice() {
            const codeInput = document.getElementById('pairingCode').value;
            const msg = document.getElementById('linkMessage');

            if (codeInput.length >= 6) {
                const newDevice = {
                    id: Date.now(),
                    name: "Unknown Android Node",
                    os: "Android OS",
                    sync: "Just now",
                    status: "active"
                };
                
                linkedDevices.unshift(newDevice); 
                document.getElementById('pairingCode').value = ""; 
                renderDevices(); 

                msg.style.display = "block";
                setTimeout(() => msg.style.display = "none", 3000);
            } else {
                alert("Please enter a valid pairing code from the mobile app.");
            }
        }

        renderDevices();
    </script>
</body>
</html>
