<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Raksha-Suraksha | Tier-3 Evidence Vault</title>
    <meta name="title" content="Raksha-Suraksha | Tier-3 Evidence Vault">
    <meta name="description" content="Authorized agents only. Secure cloud-based video evidence vault for the Raksha-Suraksha system.">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <h1>RAKSHA-SURAKSHA VAULT</h1>
    
    <div id="authGate" class="auth-box">
        <h3>IDENTITY REQUIRED</h3>
        <p>Authentication required for Cloud Vault access.</p>
        <button id="btnGoogle">SIGN IN WITH GMAIL</button>
        <p id="authError" class="warning-text"></p>
    </div>

    <div id="secureVault" class="hidden auth-box">
        <p class="highlight">AGENT: <span id="userName"></span></p>
        
        <video id="videoPreview" autoplay muted playsinline></video>
        
        <button id="btnStart">ACTIVATE HARDWARE</button>
        <button id="btnStop" class="hidden">UPLOAD EVIDENCE</button>
        
        <div id="statusText" style="color: #66FCF1; margin-top: 20px; font-weight: bold;">System Armed.</div>
    </div>

    <script>
        // VERIFIED FIREBASE KEYS
        const firebaseConfig = {
            apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI",
            authDomain: "sentinel-vault-fb4b7.firebaseapp.com",
            projectId: "sentinel-vault-fb4b7",
            storageBucket: "sentinel-vault-fb4b7.firebasestorage.app",
            messagingSenderId: "192301825793",
            appId: "1:192301825793:web:734530705f4084608fe500"
        };
        firebase.initializeApp(firebaseConfig);

        const authGate = document.getElementById('authGate');
        const secureVault = document.getElementById('secureVault');
        const userName = document.getElementById('userName');
        const statusText = document.getElementById('statusText');
        const authError = document.getElementById('authError');

        // --- AUTH LOGIC (POPUP BYPASS METHOD) ---
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                authGate.classList.add('hidden');
                secureVault.classList.remove('hidden');
                userName.innerText = user.email;
            }
        });

        document.getElementById('btnGoogle').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            authError.style.color = "#00E5FF"; // Tactical Cyan
            authError.innerText = "Opening Secure Gate... (Watch for popup blockers at the bottom of your screen)";
            
            firebase.auth().signInWithPopup(provider).catch((error) => {
                authError.style.color = "#D32F2F"; // Alert Red
                if (error.code === 'auth/popup-blocked') {
                    authError.innerText = "⚠️ Chrome blocked the login window! Please look at the very bottom of your screen and tap 'Always show' to allow Raksha-Suraksha to securely log you in.";
                } else {
                    authError.innerText = "Access Error: " + error.message;
                }
            });
        });

        // --- CLOUDINARY LOGIC ---
        let mediaRecorder; let recordedChunks = [];
        const videoPreview = document.getElementById('videoPreview');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');

        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                videoPreview.srcObject = stream;
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

                mediaRecorder.onstop = async () => {
                    statusText.innerText = "UPLOADING TO CLOUD..."; statusText.style.color = "#00E5FF"; // Tactical Cyan
                    
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const formData = new FormData();
                    
                    formData.append('file', blob, 'raksha_suraksha_log.webm');
                    formData.append('upload_preset', 'sentinel_videos'); 
                    formData.append('folder', 'sentinel_evidence'); 

                    try {
                        const response = await fetch('https://api.cloudinary.com/v1_1/duaii5zhm/video/upload', { method: 'POST', body: formData });
                        const data = await response.json();
                        if(data.secure_url) {
                            statusText.innerText = "EVIDENCE SECURED."; statusText.style.color = "#00E676"; // Success Green
                        }
                    } catch (err) { statusText.innerText = "UPLOAD FAILED."; statusText.style.color = "#D32F2F"; } // Alert Red
                    stream.getTracks().forEach(track => track.stop());
                };

                recordedChunks = []; mediaRecorder.start();
                btnStart.classList.add('hidden'); btnStop.classList.remove('hidden');
                statusText.innerText = "🔴 RECORDING..."; statusText.style.color = "#D32F2F"; // Alert Red
            } catch (err) { statusText.innerText = "Camera Permission Denied."; statusText.style.color = "#D32F2F"; } // Alert Red
        });

        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            btnStop.classList.add('hidden'); btnStart.classList.remove('hidden');
            btnStart.innerText = "NEW LOG";
        });
    </script>
</body>
</html>
