<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | Secure Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body style="justify-content: center; align-items: center;">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <h1 class="splash-title" style="font-size: 3rem;">RAKSHA-SURAKSHA</h1>
        <p class="splash-subtitle" style="font-family: 'Share Tech Mono'; color: #8892b0; letter-spacing: 4px;">INITIALIZING PROTOCOLS...</p>
    </div>

    <!-- AUTH GATEWAY -->
    <div id="authGate" class="auth-box glass-panel" style="max-width: 400px; display: none;">
        <h3>IDENTITY REQUIRED</h3>
        <p class="subtitle">Authentication required for System Access.</p>
        <button id="btnGoogle">SIGN IN WITH GMAIL</button>
        <p id="authError" class="warning-text"></p>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('authGate').style.display = 'flex';
        }, 2500);

        const firebaseConfig = {
            apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI",
            authDomain: "sentinel-vault-fb4b7.firebaseapp.com",
            projectId: "sentinel-vault-fb4b7",
            storageBucket: "sentinel-vault-fb4b7.firebasestorage.app",
            messagingSenderId: "192301825793",
            appId: "1:192301825793:web:734530705f4084608fe500"
        };
        firebase.initializeApp(firebaseConfig);

        const authError = document.getElementById('authError');

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html'; // Route to Page 2
            }
        });

        document.getElementById('btnGoogle').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            authError.style.color = "#00E5FF";
            authError.innerText = "Opening Secure Gate...";
            firebase.auth().signInWithPopup(provider).catch((error) => {
                authError.style.color = "#D32F2F";
                authError.innerText = error.code === 'auth/popup-blocked' ? "⚠️ Popup blocked! Allow it at the bottom of your screen." : "Access Error: " + error.message;
            });
        });
    </script>
</body>
</html>
