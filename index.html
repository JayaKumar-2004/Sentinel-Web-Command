<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | Tactical Command System</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #020617;
            --accent-blue: #3B82F6;
            --accent-cyan: #00E5FF;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { width: 100%; min-height: 100vh; overflow-x: hidden; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }

        /* LIVING BACKGROUND */
        .background-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
        }
        #cursorGlow {
            position: fixed; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(234, 88, 12, 0.03) 40%, transparent 70%);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: -1; transition: opacity 0.2s;
        }

        /* SPLASH SCREEN */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020617; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash-logo { width: 120px; height: 120px; margin-bottom: 25px; animation: pulseLogo 2s infinite alternate; }
        .splash-title { font-size: 2.5rem; font-weight: 800; letter-spacing: 3px; color: var(--accent-cyan); }
        .splash-subtitle { color: #64748B; font-family: 'Share Tech Mono', monospace; letter-spacing: 2px; }

        /* NAVBAR */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; width: 100%; position: relative; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-name { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }
        .btn-nav { 
            background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); 
            padding: 10px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-nav:hover { background: var(--accent-cyan); color: #020617; }

        /* HERO */
        .main-container { padding: 80px 5%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .hero-title { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 800; line-height: 1.1; margin-bottom: 24px; }
        .hero-desc { font-size: clamp(1rem, 2vw, 1.15rem); color: var(--text-muted); line-height: 1.6; margin-bottom: 40px; max-width: 700px; }
        
        .hero-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 60px; }
        .btn-primary { background: var(--accent-blue); color: white; border: none; padding: 16px 36px; border-radius: 30px; font-weight: 700; cursor: pointer; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 16px 36px; border-radius: 30px; font-weight: 600; cursor: pointer; }

        /* LOGIN MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px); z-index: 1000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.4s; padding: 20px; }
        .login-box { background: #0f172a; border: 1px solid #1E293B; border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        .tactical-input { width: 100%; padding: 14px; margin-bottom: 16px; background: rgba(0,0,0,0.4); color: white; border: 1px solid #334155; border-radius: 12px; }
        .btn-login { background: var(--accent-blue); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        
        @keyframes pulseLogo { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
    </style>
</head>
<body>
    <div class="background-layer"></div>
    <div id="cursorGlow"></div>

    <div id="splashScreen">
        <svg class="splash-logo" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="#3B82F6"/>
            <path d="M12 5.5L6 7.5V11.5C6 15.2 8.5 18.6 12 19.5C15.5 18.6 18 15.2 18 11.5V7.5L12 5.5Z" fill="#EA580C"/>
            <path d="M12 8.5L9.5 9.5V12C9.5 14 10.5 15.5 12 16C13.5 15.5 14.5 14 14.5 12V9.5L12 8.5Z" fill="#FFFFFF"/>
        </svg>
        <h1 class="splash-title">RAKSHA-SURAKSHA</h1>
        <p class="splash-subtitle">TACTICAL COMMAND SYSTEM</p>
    </div>

    <nav class="navbar">
        <div class="brand"><div class="brand-name">RAKSHA-SURAKSHA</div></div>
        <div class="nav-actions"><button onclick="openModal()">Agent Login</button></div>
    </nav>

    <main class="main-container">
        <h1 class="hero-title">Advanced Tactical<br>Tracking & Security.</h1>
        <p class="hero-desc">The ultimate command hub engineered to bridge physical mobile hardware with secure, real-time cloud analytics.</p>
        <div class="hero-buttons">
            <button class="btn-primary" onclick="openModal()">Initialize Web Terminal</button>
            <button class="btn-secondary" onclick="window.location.href='FINALpptPro5.pdf'">View Documentation</button>
        </div>
    </main>

    <div class="modal-overlay" id="loginModal">
        <div class="login-box">
            <button class="close-modal" onclick="closeModal()" style="float:right; background:none; border:none; color:white;">×</button>
            <h2>Terminal Access</h2>
            <input type="email" id="email" class="tactical-input" placeholder="Agent Email ID">
            <input type="password" id="password" class="tactical-input" placeholder="Secure Passcode">
            <button onclick="loginAgent()" class="btn-login" id="loginBtn">Initiate Uplink</button>
        </div>
    </div>

    <script>
        // JS: Tracking Glow
        const glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });
        document.addEventListener('touchmove', (e) => { glow.style.left = e.touches[0].clientX + 'px'; glow.style.top = e.touches[0].clientY + 'px'; }, {passive: true});

        // Splash
        window.addEventListener('load', () => setTimeout(() => document.getElementById('splashScreen').style.opacity = '0', 2000));
        
        // Modal
        function openModal() { document.getElementById('loginModal').style.display = 'flex'; setTimeout(() => document.getElementById('loginModal').style.opacity = '1', 10); }
        function closeModal() { document.getElementById('loginModal').style.opacity = '0'; setTimeout(() => document.getElementById('loginModal').style.display = 'none', 400); }

        // Auth
        const firebaseConfig = { apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI", authDomain: "sentinel-vault-fb4b7.firebaseapp.com", projectId: "sentinel-vault-fb4b7", storageBucket: "sentinel-vault-fb4b7.firebasestorage.app", messagingSenderId: "192301825793", appId: "1:192301825793:web:734530705f4084608fe500" };
        firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged(user => { if (user) window.location.href = 'flow.html'; });
        function loginAgent() { firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(err => alert(err.message)); }
    </script>
</body>
</html>
