<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Raksha-Suraksha</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050a14;
  --bg2: #0a1224;
  --cyan: #00E5FF;
  --blue: #3B82F6;
  --orange: #FF6B35;
  --green: #00FF88;
  --text: #F5F7FA;
  --muted: #A0AEC0;
  --error: #EF4444;
  --success: #10B981;
  --glow-c: 0 0 20px rgba(0,229,255,0.6), 0 0 40px rgba(0,229,255,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  width: 100%; min-height: 100vh; overflow-x: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Rajdhani', sans-serif; line-height: 1.6;
  display: flex; align-items: center; justify-content: center;
}

#bgCanvas { position: fixed; inset: 0; z-index: -3; pointer-events: none; }
.grid-bg {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background-image: linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
}

.auth-container {
  width: 100%; max-width: 500px; padding: 40px 30px;
  position: relative; z-index: 1;
}

.auth-card {
  background: linear-gradient(145deg, rgba(10,20,40,0.95), rgba(5,12,28,0.99));
  border: 1.5px solid var(--cyan);
  border-radius: 16px; padding: 50px 40px;
  position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.auth-card::before {
  content: ''; position: absolute;
  top: -50%; left: -50%; width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(0,229,255,0.08), transparent);
  animation: rotateBg 15s linear infinite;
}
@keyframes rotateBg {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.auth-content { position: relative; z-index: 1; }

.auth-header {
  text-align: center; margin-bottom: 30px;
}

.auth-logo {
  width: 60px; height: 60px; margin: 0 auto 20px;
}

.auth-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.6rem; font-weight: 900;
  letter-spacing: 2px; color: var(--cyan);
  text-shadow: 0 0 15px rgba(0,229,255,0.6);
  margin-bottom: 8px;
}

.auth-subtitle {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem; letter-spacing: 3px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 16px;
}

.auth-description {
  font-size: 0.9rem; color: var(--muted);
  line-height: 1.6; text-align: center;
}

.form-group {
  margin-bottom: 20px; margin-top: 30px;
}

.form-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; letter-spacing: 2px;
  color: var(--cyan); display: block;
  margin-bottom: 8px; text-transform: uppercase;
  font-weight: 600;
}

.form-input {
  width: 100%; padding: 13px 16px;
  background: rgba(0,0,0,0.5);
  color: var(--text);
  border: 1px solid rgba(0,229,255,0.25);
  border-radius: 8px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.95rem; outline: none;
  transition: all 0.3s;
}

.form-input::placeholder {
  color: rgba(160,174,192,0.4);
}

.form-input:focus {
  border-color: var(--cyan);
  background: rgba(0,229,255,0.08);
  box-shadow: 0 0 15px rgba(0,229,255,0.2);
}

.form-input.error {
  border-color: var(--error);
  background: rgba(239,68,68,0.05);
}

.error-message {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: var(--error);
  margin-top: 6px; display: none;
  padding: 10px; background: rgba(239,68,68,0.1);
  border-left: 3px solid var(--error); border-radius: 4px;
}

.error-message.show { display: block; }

.success-message {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem; color: var(--success);
  background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
  padding: 16px; border-radius: 8px; margin-bottom: 20px;
  display: none;
  animation: slideDown 0.3s ease;
}

.success-message.show { display: block; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.form-button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  color: #050a14; border: none;
  border-radius: 8px; cursor: pointer;
  font-family: 'Orbitron', monospace;
  font-size: 0.9rem; letter-spacing: 2px;
  font-weight: 700; text-transform: uppercase;
  margin-top: 10px; transition: all 0.3s;
  position: relative; overflow: hidden;
}

.form-button::before {
  content: ''; position: absolute;
  top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s;
}

.form-button:hover::before { left: 100%; }

.form-button:hover {
  box-shadow: var(--glow-c);
  transform: translateY(-2px);
}

.form-button:disabled {
  opacity: 0.6; cursor: not-allowed;
  box-shadow: none; transform: none;
}

.form-button.loading::after {
  content: ''; position: absolute;
  width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.6s linear infinite;
  right: 16px; top: 50%; transform: translateY(-50%);
}

@keyframes spin {
  to { transform: translateY(-50%) rotate(360deg); }
}

.auth-footer {
  text-align: center; margin-top: 30px;
}

.auth-footer p {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem; color: var(--muted);
  margin-bottom: 12px;
}

.auth-footer a {
  color: var(--cyan); text-decoration: none;
  font-weight: 600; transition: color 0.3s;
  display: inline-flex; align-items: center; gap: 6px;
}

.auth-footer a:hover { color: var(--blue); }

.step-indicator {
  display: flex; justify-content: center; gap: 8px;
  margin-bottom: 20px;
}

.step {
  width: 30px; height: 30px;
  border: 2px solid rgba(0,229,255,0.3);
  border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; font-weight: 600;
  color: var(--muted); transition: all 0.3s;
}

.step.active {
  border-color: var(--cyan); background: rgba(0,229,255,0.1);
  color: var(--cyan); box-shadow: 0 0 15px rgba(0,229,255,0.3);
}

.step.completed {
  border-color: var(--success); background: rgba(16,185,129,0.1);
  color: var(--success);
}

.hidden { display: none; }

@media(max-width: 600px) {
  .auth-container { padding: 20px; }
  .auth-card { padding: 40px 20px; }
  .auth-title { font-size: 1.4rem; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="grid-bg"></div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-content">
      
      <div class="auth-header">
        <svg class="auth-logo" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="#3B82F6"/>
          <path d="M12 5.5L6 7.5V11.5C6 15.2 8.5 18.6 12 19.5C15.5 18.6 18 15.2 18 11.5V7.5L12 5.5Z" fill="#FF6B35"/>
          <path d="M12 8.5L9.5 9.5V12C9.5 14 10.5 15.5 12 16C13.5 15.5 14.5 14 14.5 12V9.5L12 8.5Z" fill="white"/>
        </svg>
        <div class="auth-title">PASSWORD RESET</div>
        <div class="auth-subtitle">SECURE RECOVERY</div>
        <p class="auth-description">Enter your email address and we'll send you instructions to reset your password.</p>
      </div>

      <div class="step-indicator">
        <div class="step active" id="step1">1</div>
        <div class="step" id="step2">2</div>
      </div>

      <div class="success-message" id="successMsg">
        ✓ Recovery email sent successfully! Check your inbox for further instructions.
      </div>

      <!-- STEP 1: Enter Email -->
      <form id="emailForm" class="step-content">
        <div class="form-group">
          <label class="form-label">Registered Email Address</label>
          <input type="email" id="resetEmail" class="form-input" placeholder="agent@tactical.ops"
                 required>
          <div class="error-message" id="emailError"></div>
        </div>

        <button type="submit" class="form-button" id="sendBtn">⚡ Send Recovery Email</button>
      </form>

      <!-- STEP 2: Reset Password -->
      <form id="resetForm" class="step-content hidden">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="newPass" class="form-input" placeholder="••••••••••••"
                 required minlength="8">
          <div class="error-message" id="passError"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirmPass" class="form-input" placeholder="••••••••••••"
                 required>
          <div class="error-message" id="confirmError"></div>
        </div>

        <button type="submit" class="form-button" id="resetBtn">⚡ Reset Password</button>
      </form>

      <div class="auth-footer">
        <p id="footerText">Remember your password? <a href="index.html">← Back to Login</a></p>
      </div>

    </div>
  </div>
</div>

<script>
// Firebase
const fbCfg = {
  apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI",
  authDomain: "sentinel-vault-fb4b7.firebaseapp.com",
  projectId: "sentinel-vault-fb4b7",
  storageBucket: "sentinel-vault-fb4b7.firebasestorage.app",
  messagingSenderId: "192301825793",
  appId: "1:192301825793:web:734530705f4084608fe500"
};
firebase.initializeApp(fbCfg);

// Check if already logged in
firebase.auth().onAuthStateChanged(user => {
  if (user) window.location.href = 'flow.html';
});

// Get reset code from URL (if Firebase sends it)
const urlParams = new URLSearchParams(window.location.search);
const resetCode = urlParams.get('oobCode');

if (resetCode) {
  showStep2();
}

function showStep1() {
  document.getElementById('emailForm').classList.remove('hidden');
  document.getElementById('resetForm').classList.add('hidden');
  document.getElementById('step1').classList.add('active');
  document.getElementById('step1').classList.remove('completed');
  document.getElementById('step2').classList.remove('active');
  document.getElementById('footerText').innerHTML = 'Remember your password? <a href="index.html">← Back to Login</a>';
}

function showStep2() {
  document.getElementById('emailForm').classList.add('hidden');
  document.getElementById('resetForm').classList.remove('hidden');
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step1').classList.add('completed');
  document.getElementById('step2').classList.add('active');
  document.getElementById('footerText').innerHTML = '<a href="index.html">← Back to Login</a>';
}

// Step 1: Send recovery email
document.getElementById('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('resetEmail').value.trim();
  const btn = document.getElementById('sendBtn');
  
  // Clear errors
  document.getElementById('emailError').classList.remove('show');
  document.getElementById('resetEmail').classList.remove('error');
  
  if (!email.includes('@')) {
    showEmailError('Invalid email address');
    return;
  }
  
  btn.disabled = true;
  btn.classList.add('loading');
  
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    
    // Show success message
    document.getElementById('successMsg').classList.add('show');
    
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 3000);
    
  } catch (error) {
    btn.disabled = false;
    btn.classList.remove('loading');
    
    if (error.code === 'auth/user-not-found') {
      showEmailError('No account found with this email');
    } else if (error.code === 'auth/invalid-email') {
      showEmailError('Invalid email address');
    } else {
      showEmailError(error.message);
    }
  }
});

function showEmailError(message) {
  const err = document.getElementById('emailError');
  err.textContent = '✕ ' + message;
  err.classList.add('show');
  document.getElementById('resetEmail').classList.add('error');
}

// Step 2: Reset password with code
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const btn = document.getElementById('resetBtn');
  
  // Clear errors
  document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
  
  if (newPass.length < 8) {
    showError('passError', 'Password must be at least 8 characters');
    return;
  }
  
  if (newPass !== confirmPass) {
    showError('confirmError', 'Passwords do not match');
    return;
  }
  
  btn.disabled = true;
  btn.classList.add('loading');
  
  try {
    // If using Firebase's reset code
    if (resetCode) {
      await firebase.auth().confirmPasswordReset(resetCode, newPass);
    } else {
      // Alternative: User provides email and has received reset code
      const email = prompt('Please enter your email address:');
      await firebase.auth().sendPasswordResetEmail(email);
    }
    
    document.getElementById('successMsg').innerHTML = '✓ Password reset successfully! Redirecting to login...';
    document.getElementById('successMsg').classList.add('show');
    
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2000);
    
  } catch (error) {
    btn.disabled = false;
    btn.classList.remove('loading');
    showError('passError', error.message);
  }
});

function showError(elementId, message) {
  const el = document.getElementById(elementId);
  el.textContent = '✕ ' + message;
  el.classList.add('show');
  
  const inputId = elementId.replace('Error', '');
  const input = document.getElementById(inputId) || 
                document.getElementById(inputId.replace(/Error/, ''));
  if (input) input.classList.add('error');
}

// Background particles
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
bgCanvas.width = window.innerWidth;
bgCanvas.height = window.innerHeight;

const particles = Array.from({length: 50}, () => ({
  x: Math.random() * bgCanvas.width,
  y: Math.random() * bgCanvas.height,
  vx: (Math.random() - 0.5) * 0.3,
  vy: (Math.random() - 0.5) * 0.3,
  r: Math.random() * 1 + 0.3,
  a: Math.random() * 0.3 + 0.08
}));

function animate() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(0,229,255,${p.a})`;
    bgCtx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
});
</script>
</body>
          </html>
