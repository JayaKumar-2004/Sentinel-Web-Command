<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | App Controls</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* Custom grid for control buttons to prevent overlaps */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .control-grid button { width: 100%; margin: 0; }
        
        #statusTerminal {
            width: 100%;
            background: #101820;
            color: #00E676;
            font-family: 'Share Tech Mono', monospace;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #00E676;
            margin-top: 20px;
            text-align: left;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="rolling-header">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            🔴 RAKSHA-SURAKSHA : REMOTE HARDWARE MODIFICATION MODULE ACTIVE 🔴
        </marquee>
    </div>

    <header class="topbar">
        <a href="master-control.html" class="btn-tactical" style="width: auto; padding: 5px 10px; margin: 0; max-width: none;">⬅️ BACK</a>
        <div class="topbar-logo"><h2>APP CONTROLS</h2></div>
        <div class="topbar-account" id="userEmail" style="color: #00E5FF;">VERIFYING...</div>
    </header>

    <main class="dashboard-content" style="max-width: 800px;">
        
        <section class="glass-panel">
            <h3>🎛️ HARDWARE OVERRIDE</h3>
            <p class="subtitle">Push execution payloads directly to the target device.</p>
            
            <button onclick="sendCommand('LOCK_ACCESSIBILITY')" class="btn-tactical" style="border-color: #ff3366; color: #ff3366; width: 100%; max-width: 100%;">
                🔒 INSTANT LOCK (Accessibility Override)
            </button>

            <h4 style="color: #66FCF1; margin-top: 20px; width: 100%; text-align: left;">Screen Timeout</h4>
            <div class="control-grid">
                <button onclick="sendCommand('TIMEOUT_1S')" class="btn-tactical">1 SEC</button>
                <button onclick="sendCommand('TIMEOUT_10S')" class="btn-tactical">10 SEC</button>
                <button onclick="sendCommand('TIMEOUT_1M')" class="btn-tactical">1 MIN</button>
                <button onclick="sendCommand('TIMEOUT_5M')" class="btn-tactical">5 MIN</button>
            </div>

            <h4 style="color: #66FCF1; margin-top: 10px; width: 100%; text-align: left;">Display Brightness</h4>
            <div class="control-grid">
                <button onclick="sendCommand('BRIGHTNESS_0')" class="btn-tactical">0%</button>
                <button onclick="sendCommand('BRIGHTNESS_30')" class="btn-tactical">30%</button>
                <button onclick="sendCommand('BRIGHTNESS_50')" class="btn-tactical">50%</button>
                <button onclick="sendCommand('BRIGHTNESS_80')" class="btn-tactical">80%</button>
                <button onclick="sendCommand('BRIGHTNESS_100')" class="btn-tactical">100%</button>
            </div>

            <div id="statusTerminal">
                > CONNECTION ESTABLISHED...<br>> WAITING FOR COMMAND...
            </div>
        </section>

    </main>

    <script>
        // 1. Firebase Configuration (Added databaseURL for Realtime DB)
        const firebaseConfig = { 
            apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI", 
            authDomain: "sentinel-vault-fb4b7.firebaseapp.com", 
            databaseURL: "https://sentinel-vault-fb4b7-default-rtdb.firebaseio.com",
            projectId: "sentinel-vault-fb4b7", 
            storageBucket: "sentinel-vault-fb4b7.firebasestorage.app", 
            messagingSenderId: "192301825793", 
            appId: "1:192301825793:web:734530705f4084608fe500" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. Auth Check
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('userEmail').innerText = "AGENT: " + user.email.split('@')[0].toUpperCase();
            } else {
                window.location.href = 'index.html'; // Kick out if not logged in
            }
        });

        // 3. Command Exfiltration Logic
        function sendCommand(cmdString) {
            const terminal = document.getElementById('statusTerminal');
            terminal.innerHTML = `> UPLOADING PAYLOAD: ${cmdString}...`;
            terminal.style.color = "#FF9800"; // Orange warning color during upload

            // Push to the exact node the Android app is listening to
            database.ref('RakshaLink/CurrentCommand').set({
                command: cmdString,
                timestamp: Date.now()
            }).then(() => {
                // Success Callback
                terminal.innerHTML = `> PAYLOAD SECURED.<br>> EXECUTED: ${cmdString}`;
                terminal.style.color = "#00E676"; // Green success color
            }).catch((error) => {
                // Error Callback
                terminal.innerHTML = `> UPLOAD FAILED.<br>> ERR: ${error.message}`;
                terminal.style.color = "#ff3366"; // Red error color
            });
        }
    </script>
</body>
</html>
