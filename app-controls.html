<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | App Controls</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 🚀 THEME VARIABLES */
        :root[data-theme="dark"] { --bg-deep: #030712; --bg-panel: rgba(15, 23, 42, 0.85); --cyan-glow: #00E5FF; --text-main: #F8FAFC; --text-muted: #94A3B8; --border-line: rgba(0, 229, 255, 0.2); --shadow-color: rgba(0, 229, 255, 0.3); --danger: #EF4444; --danger-bg: rgba(239, 68, 68, 0.1); --warning: #F59E0B; --success: #10B981; --input-bg: rgba(0,0,0,0.8); --terminal-text: #10B981; }
        :root[data-theme="light"] { --bg-deep: #F1F5F9; --bg-panel: rgba(255, 255, 255, 0.95); --cyan-glow: #1D4ED8; --text-main: #0F172A; --text-muted: #475569; --border-line: rgba(29, 78, 216, 0.2); --shadow-color: rgba(29, 78, 216, 0.2); --danger: #DC2626; --danger-bg: rgba(220, 38, 38, 0.1); --warning: #D97706; --success: #059669; --input-bg: #FFFFFF; --terminal-text: #059669; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-deep); color: var(--text-main); }
        #interactiveCanvas { position: fixed; inset: 0; z-index: -3; width: 100%; height: 100%; pointer-events: none; }
        .grid-overlay { position: fixed; inset: 0; z-index: -2; pointer-events: none; background-image: linear-gradient(var(--border-line) 1px, transparent 1px), linear-gradient(90deg, var(--border-line) 1px, transparent 1px); background-size: 60px 60px; opacity: 0.2; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--bg-panel); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-line); position: fixed; top: 0; width: 100%; z-index: 1500; }
        .brand-name { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; color: var(--text-main); letter-spacing: 2px;}
        .return-base-btn { font-family: 'Space Mono', monospace; color: var(--cyan-glow); text-decoration: none; font-size: 0.85rem; font-weight: 700; border: 1px solid var(--border-line); padding: 8px 16px; border-radius: 6px; background: rgba(0, 229, 255, 0.05); }

        main { flex-grow: 1; padding: 100px 5% 60px 5%; display: flex; flex-direction: column; align-items: center; }
        .content-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 30px;}
        .module-panel { background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 12px; backdrop-filter: blur(10px); padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .panel-header { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--text-main); font-weight: 800; letter-spacing: 1px; display: flex; justify-content: center; margin-bottom: 25px;}

        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;}
        .btn-ctrl { flex: 1; min-width: 80px; padding: 10px 5px; background: transparent; border: 1px solid var(--cyan-glow); color: var(--cyan-glow); font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; border-radius: 4px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-ctrl:hover { background: var(--cyan-glow); color: var(--bg-deep); box-shadow: 0 0 10px var(--shadow-color); }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #FFF; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .btn-warning { border-color: var(--warning); color: var(--warning); }
        .btn-warning:hover { background: var(--warning); color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .btn-full { width: 100%; margin-bottom: 20px; }
        .sub-label { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--text-main); margin-bottom: 10px; font-weight: 700;}

        .terminal-box { background: var(--input-bg); border: 1px solid var(--border-line); border-radius: 6px; padding: 15px; font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--terminal-text); height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }

        /* SOS Inputs */
        .sos-input-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .sos-input { flex: 1; min-width: 150px; background: transparent; border: 1px solid var(--border-line); padding: 10px; color: var(--text-main); font-family: 'Space Mono'; font-size: 0.85rem; border-radius: 4px; outline: none; }
        
        #authLoader { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; justify-content: center; align-items: center; font-family: 'Orbitron'; color: var(--cyan-glow); font-size: 1.5rem; letter-spacing: 2px;}
    </style>
</head>
<body>

    <div id="authLoader">VERIFYING CREDENTIALS...</div>
    <canvas id="interactiveCanvas"></canvas>
    <div class="grid-overlay"></div>

    <nav class="nav">
        <a href="services.html" class="return-base-btn">⟵ BACK</a>
        <div class="brand-name">APP CONTROLS</div>
        <div style="width: 80px;"></div> </nav>

    <main>
        <div class="content-wrapper">
            
            <div class="module-panel">
                <div class="panel-header">🎛️ HARDWARE OVERRIDE</div>
                
                <button class="btn-ctrl btn-danger btn-full" onclick="issueFirebaseCommand('LOCK_ACCESSIBILITY', '🔒 ACCESSIBILITY LOCK COMMAND PUSHED.')">🔒 INSTANT LOCK (Accessibility Override)</button>

                <div class="sub-label">Screen Timeout</div>
                <div class="btn-row">
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('TIMEOUT_1S', 'Screen timeout 1s pushed.')">1 SEC</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('TIMEOUT_10S', 'Screen timeout 10s pushed.')">10 SEC</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('TIMEOUT_1M', 'Screen timeout 1m pushed.')">1 MIN</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('TIMEOUT_5M', 'Screen timeout 5m pushed.')">5 MIN</button>
                </div>

                <div class="sub-label">Display Brightness</div>
                <div class="btn-row">
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('BRIGHTNESS_0', 'Brightness 0% pushed.')">0%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('BRIGHTNESS_30', 'Brightness 30% pushed.')">30%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('BRIGHTNESS_50', 'Brightness 50% pushed.')">50%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('BRIGHTNESS_80', 'Brightness 80% pushed.')">80%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('BRIGHTNESS_100', 'Brightness 100% pushed.')">100%</button>
                </div>

                <div class="sub-label">Media Volume Override</div>
                <div class="btn-row">
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('VOL_0', 'Volume 0% pushed.')">0%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('VOL_30', 'Volume 30% pushed.')">30%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('VOL_60', 'Volume 60% pushed.')">60%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('VOL_80', 'Volume 80% pushed.')">80%</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('VOL_100', 'Volume 100% pushed.')">100%</button>
                </div>

                <div class="sub-label" style="color: var(--danger);">Anti-Theft Siren & Strobe</div>
                <div class="btn-row">
                    <button class="btn-ctrl btn-danger" onclick="issueFirebaseCommand('ALARM_ON', '🚨 ANTI-THEFT SIREN TRIGGERED.')">🚨 TRIGGER SIREN</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('ALARM_OFF', '🔇 ANTI-THEFT SIREN DISARMED.')">🔇 DISARM SIREN</button>
                    <button class="btn-ctrl btn-warning" onclick="issueFirebaseCommand('FLASH_BLINK', '⚡ STROBE FLASH ENGAGED.')">⚡ STROBE FLASH</button>
                    <button class="btn-ctrl" onclick="issueFirebaseCommand('FLASH_OFF', '❌ STROBE FLASH DISABLED.')">❌ FLASH OFF</button>
                </div>

                <div class="terminal-box" id="termLog">
                    <div>> SECURE FIREBASE UPLINK ESTABLISHED.</div>
                    <div>> AWAITING AGENT COMMANDS...</div>
                </div>
            </div>

            <div class="module-panel">
                <div class="panel-header" style="color: var(--danger);">🚨 EMERGENCY COMMUNICATIONS</div>

                <div class="btn-row" id="emergencyGroup">
                    <button class="btn-ctrl btn-danger" onclick="issueFirebaseCommand('CALL_NUM:112', 'FORCE DIALING: POLICE (112)')">POLICE (112)</button>
                    <button class="btn-ctrl btn-danger" onclick="issueFirebaseCommand('CALL_NUM:108', 'FORCE DIALING: AMBULANCE (108)')">AMBULANCE (108)</button>
                    <button class="btn-ctrl btn-danger" onclick="issueFirebaseCommand('CALL_NUM:101', 'FORCE DIALING: FIRE (101)')">FIRE (101)</button>
                </div>

                <div class="sub-label" style="margin-top: 20px; color: var(--success);">Custom SOS Auto-Dialer</div>
                <div class="sos-input-row">
                    <input type="text" id="sosName" class="sos-input" placeholder="Name">
                    <input type="text" id="sosNum" class="sos-input" placeholder="Phone Number">
                </div>
                <button class="btn-ctrl btn-full" style="border-color: var(--success); color: var(--success);" onclick="addSOS()">+ STORE & DIAL</button>
            </div>

        </div>
    </main>

    <script>
        const fbCfg = { apiKey: "AIzaSyA7SlllDkivi27WF7ikTRjqb4GqRIoYxlI", authDomain: "sentinel-vault-fb4b7.firebaseapp.com", projectId: "sentinel-vault-fb4b7", storageBucket: "sentinel-vault-fb4b7.firebasestorage.app", messagingSenderId: "192301825793", appId: "1:192301825793:web:734530705f4084608fe500" };
        if (!firebase.apps.length) { firebase.initializeApp(fbCfg); }
        const database = firebase.database();
        let currentUserId = null;

        const terminal = document.getElementById('termLog');
        
        // 🚀 FIREBASE WRITER: PATH MATCHES JAVA PERFECTLY
        function issueFirebaseCommand(cmdCode, logMessage) {
            if(!currentUserId) { alert("Agent connection lost."); return; }

            // JAVA APP LISTENS HERE: "users/" + userUid + "/CurrentCommand"
            database.ref('users/' + currentUserId + '/CurrentCommand').set({
                command: cmdCode,
                timestamp: Date.now()
            }).then(() => {
                const div = document.createElement('div');
                div.textContent = `> ${logMessage}`;
                terminal.appendChild(div);
                terminal.scrollTop = terminal.scrollHeight;
            }).catch(err => {
                const div = document.createElement('div');
                div.style.color = "red";
                div.textContent = "> ERROR: " + err.message;
                terminal.appendChild(div);
            });
        }

        // SOS UI Helper
        function addSOS() {
            const num = document.getElementById('sosNum').value;
            const name = document.getElementById('sosName').value;
            if(!num) return;
            issueFirebaseCommand('CALL_NUM:' + num, 'FORCE DIALING: ' + name);
            document.getElementById('sosNum').value = '';
            document.getElementById('sosName').value = '';
        }

        firebase.auth().onAuthStateChanged(user => { 
            if (!user) window.location.href = 'index.html'; 
            else {
                currentUserId = user.uid;
                document.getElementById('authLoader').style.display = 'none';
            }
        });

        // Theme Background Setup
        document.documentElement.setAttribute('data-theme', localStorage.getItem('tactical_theme') || 'dark');
        const canvas = document.getElementById('interactiveCanvas'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = []; for (let i = 0; i < 65; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5 });
        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); const rgbLine = document.documentElement.getAttribute('data-theme') === 'light' ? '29, 78, 216' : '0, 229, 255';
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > canvas.width) p.vx *= -1; if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                for (let j = i + 1; j < particles.length; j++) {
                    let dist = Math.sqrt((p.x - particles[j].x)**2 + (p.y - particles[j].y)**2);
                    if (dist < 140) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(${rgbLine}, ${0.2 - dist/700})`; ctx.lineWidth = 0.5; ctx.stroke(); }
                }
            } requestAnimationFrame(animateCanvas);
        } animateCanvas(); window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
