<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | Advanced Satellite Radar</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        /* TACTICAL MAP FIXES */
        body, html { margin: 0; padding: 0; overflow: hidden; }
        #google-map { background-color: #020c1b; height: calc(100vh - 90px); width: 100vw; z-index: 1; }
        .leaflet-routing-container { display: none !important; }

        /* FLOATING TOGGLE BUTTON */
        #panelToggleBtn {
            position: absolute; top: 100px; right: 15px; z-index: 1001;
            width: auto; background: rgba(2, 12, 27, 0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); margin: 0; padding: 10px 15px;
        }

        /* CUSTOM COMMAND PANEL */
        .custom-routing-panel {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 1000;
            background: rgba(2, 12, 27, 0.95); backdrop-filter: blur(8px);
            border: 1px solid #00E5FF; border-radius: 12px; padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.9);
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }

        .panel-closed { opacity: 0; visibility: hidden; transform: translate(-50%, -20px); }

        /* Panel Header & Close Button */
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
        .panel-header h3 { color: #00E5FF; font-size: 1.1rem; margin: 0; letter-spacing: 1px; }
        .close-btn { 
            background: rgba(255, 51, 102, 0.1); border: 2px solid #ff3366; color: #ff3366; 
            border-radius: 50%; width: 35px; height: 35px; cursor: pointer; 
            font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; 
        }
        
        .section-title { color: #8892b0; font-size: 0.8rem; margin: 10px 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }

        .tactical-input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            background: rgba(16, 24, 32, 0.8); color: #00E5FF;
            border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 6px;
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
        }
        .tactical-input::placeholder { color: #8892b0; }
        .tactical-input:focus { outline: none; border: 1px solid #00E5FF; }

        .btn-row { display: flex; gap: 10px; width: 100%; margin-bottom: 10px; }
        .btn-row button { margin-bottom: 0; padding: 10px 5px; font-size: 0.75rem; width: 100%; }
    </style>
</head>
<body>

    <div class="rolling-header">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            🔴 RAKSHA-SURAKSHA : OPEN-SOURCE SATELLITE TRACKING & ROUTING ACTIVE 🔴
        </marquee>
    </div>

    <header class="topbar">
        <a href="dashboard.html" class="btn-tactical" style="width: auto; padding: 5px 10px; margin: 0; max-width: none;">⬅️ BACK</a>
        <div class="topbar-logo"><h2>SATELLITE RADAR</h2></div>
        <div class="topbar-account" style="color: #00E676;">GPS ACTIVE</div>
    </header>

    <button id="panelToggleBtn" onclick="togglePanel()" class="btn-tactical">🗺️ COMMAND PANEL</button>

    <div id="routingPanel" class="custom-routing-panel">
        
        <div class="panel-header">
            <h3>COMMAND TERMINAL</h3>
            <button onclick="togglePanel()" class="close-btn">&times;</button>
        </div>

        <p style="color: #00E676; font-size: 0.8rem; margin-bottom: 10px; text-align: center;">💡 Tip: Tap anywhere directly on map to drop Origin & Dest pins manually!</p>

        <div class="section-title">🔍 Location Search</div>
        <input type="text" id="searchInput" placeholder="Search City, Area, or Landmark..." class="tactical-input">
        <button onclick="searchOnly()" class="btn-tactical" style="width: 100%; margin-bottom: 15px; border-color: #00E5FF; color: #00E5FF;">DROP PIN</button>

        <div class="section-title">🛰️ Tactical Routing</div>
        <input type="text" id="originInput" placeholder="Start Point (Origin)" class="tactical-input">
        <input type="text" id="destInput" placeholder="End Point (Destination)" class="tactical-input">
        
        <div class="btn-row">
            <button onclick="routeAtoB()" class="btn-tactical">📍 ORIGIN ➔ DEST</button>
            <button onclick="routeGpsToDest()" class="btn-tactical" style="border-color: #ff3366; color: #ff3366;">🛰️ MY GPS ➔ DEST</button>
        </div>
        
        <div class="section-title">⚙️ System Controls</div>
        <div class="btn-row">
            <button id="btnTracker" onclick="toggleTracker()" class="btn-tactical" style="border-color: #00E676; color: #00E676;">🟢 TRACKER: ON</button>
            <button onclick="centerMapOnGPS()" class="btn-tactical" style="border-color: #00E5FF; color: #00E5FF;">🎯 CENTER</button>
            <button onclick="clearMap()" class="btn-tactical" style="border-color: #8892b0; color: #8892b0;">🗑️ CLEAR</button>
        </div>

    </div>

    <div id="google-map"></div>

    <script>
        var map = L.map('google-map', { zoomControl: false }).setView([12.9716, 77.5946], 12); 
        L.control.zoom({ position: 'bottomleft' }).addTo(map); 

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 18
        }).addTo(map);

        var geocoder = L.Control.Geocoder.nominatim();
        var searchLayer = L.layerGroup().addTo(map); 
        var manualPinLayer = L.layerGroup().addTo(map); 

        var routingControl = L.Routing.control({
            waypoints: [], routeWhileDragging: false, show: false, 
            lineOptions: { styles: [{color: '#ff3366', opacity: 0.9, weight: 6}] },
            createMarker: function() { return null; } 
        }).addTo(map);

        function togglePanel() {
            document.getElementById('routingPanel').classList.toggle('panel-closed');
        }

        // --- FIXED: PURE JAVASCRIPT TAP-TO-ROUTE PROTOCOL ---
        var manualOriginLatLng = null;
        var manualDestLatLng = null;

        map.on('click', function(e) {
            if (manualOriginLatLng == null) {
                // First Tap
                manualOriginLatLng = e.latlng;
                L.circleMarker(manualOriginLatLng, {radius: 10, color: '#00E676', fillColor: '#00E676', fillOpacity: 0.8})
                    .addTo(manualPinLayer).bindPopup("<b style='color:black;'>📌 MANUAL ORIGIN START</b>").openPopup();
                
                document.getElementById('originInput').value = manualOriginLatLng.lat.toFixed(4) + ", " + manualOriginLatLng.lng.toFixed(4);
            } else if (manualDestLatLng == null) {
                // Second Tap
                manualDestLatLng = e.latlng;
                L.circleMarker(manualDestLatLng, {radius: 10, color: '#ff3366', fillColor: '#ff3366', fillOpacity: 0.8})
                    .addTo(manualPinLayer).bindPopup("<b style='color:black;'>🎯 MANUAL DEST TARGET</b>").openPopup();
                
                document.getElementById('destInput').value = manualDestLatLng.lat.toFixed(4) + ", " + manualDestLatLng.lng.toFixed(4);
                
                // Draw route immediately
                routingControl.setWaypoints([manualOriginLatLng, manualDestLatLng]);
                document.getElementById('routingPanel').classList.add('panel-closed'); // Auto-hide panel to show route
            }
        });

        function clearMap() {
            searchLayer.clearLayers(); 
            manualPinLayer.clearLayers();
            routingControl.setWaypoints([]); 
            manualOriginLatLng = null;
            manualDestLatLng = null;
            document.getElementById('searchInput').value = "";
            document.getElementById('originInput').value = "";
            document.getElementById('destInput').value = "";
        }

        // GPS TRACKING
        var isTracking = true;
        var currentGpsLocation = null;
        var liveMarker = null, liveCircle = null;
        var customGpsIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/149/149059.png', iconSize: [25, 25] });

        map.locate({setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true});

        map.on('locationfound', function(e) {
            currentGpsLocation = e.latlng;
            var radius = e.accuracy / 2;
            
            if (!liveMarker) {
                liveMarker = L.marker(e.latlng, {icon: customGpsIcon}).addTo(map).bindPopup("<b style='color:black;'>📱 AGENT LOCATED</b>");
                liveCircle = L.circle(e.latlng, radius, {color: '#00E5FF', fillColor: '#00E5FF', fillOpacity: 0.2}).addTo(map);
            } else {
                liveMarker.setLatLng(e.latlng);
                liveCircle.setLatLng(e.latlng);
                liveCircle.setRadius(radius);
            }
        });

        function toggleTracker() {
            var btn = document.getElementById('btnTracker');
            if(isTracking) {
                map.stopLocate(); isTracking = false;
                btn.innerHTML = "⚪ TRACKER: OFF"; btn.style.color = "#8892b0"; btn.style.borderColor = "#8892b0";
                if(liveMarker) map.removeLayer(liveMarker); if(liveCircle) map.removeLayer(liveCircle);
                liveMarker = null; liveCircle = null;
            } else {
                map.locate({setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true});
                isTracking = true;
                btn.innerHTML = "🟢 TRACKER: ON"; btn.style.color = "#00E676"; btn.style.borderColor = "#00E676";
            }
        }

        function centerMapOnGPS() {
            if (currentGpsLocation) {
                map.setView(currentGpsLocation, 16);
                document.getElementById('routingPanel').classList.add('panel-closed'); 
            } else {
                alert("GPS lock not acquired yet.");
            }
        }

        // TIMEOUT SEARCH LOGIC
        function searchOnly() {
            var query = document.getElementById('searchInput').value;
            if(!query) return alert("Enter a location to search.");
            
            document.getElementById('searchInput').value = "Scanning...";
            
            var timeout = setTimeout(function() {
                document.getElementById('searchInput').value = query;
                alert("Server busy. Please try again.");
            }, 6000);

            geocoder.geocode(query, function(results) {
                clearTimeout(timeout); 
                if(results && results.length > 0) {
                    searchLayer.clearLayers(); 
                    var latlng = results[0].center;
                    L.marker(latlng).addTo(searchLayer).bindPopup("<b style='color:black;'>" + results[0].name + "</b>").openPopup();
                    map.setView(latlng, 15);
                    document.getElementById('searchInput').value = query;
                    document.getElementById('routingPanel').classList.add('panel-closed');
                } else {
                    alert("Location not found.");
                    document.getElementById('searchInput').value = query;
                }
            });
        }

        function routeAtoB() {
            var origin = document.getElementById('originInput').value;
            var dest = document.getElementById('destInput').value;
            if(!origin || !dest) return alert("Please enter both Start and End points.");

            document.getElementById('originInput').value = "Calculating...";
            document.getElementById('destInput').value = "Calculating...";

            var timeout = setTimeout(function() {
                document.getElementById('originInput').value = origin;
                document.getElementById('destInput').value = dest;
                alert("Routing server busy. Try again.");
            }, 8000);
            
            geocoder.geocode(origin, function(resultsOrigin) {
                if(resultsOrigin && resultsOrigin.length > 0) {
                    setTimeout(function() {
                        geocoder.geocode(dest, function(resultsDest) {
                            clearTimeout(timeout); 
                            if(resultsDest && resultsDest.length > 0) {
                                document.getElementById('originInput').value = origin;
                                document.getElementById('destInput').value = dest;
                                routingControl.setWaypoints([resultsOrigin[0].center, resultsDest[0].center]);
                                document.getElementById('routingPanel').classList.add('panel-closed'); 
                            } else {
                                alert("Destination not found.");
                            }
                        });
                    }, 1000); 
                } else {
                    clearTimeout(timeout);
                    alert("Origin not found.");
                    document.getElementById('originInput').value = origin;
                    document.getElementById('destInput').value = dest;
                }
            });
        }

        function routeGpsToDest() {
            var dest = document.getElementById('destInput').value;
            if(!dest) return alert("Please enter an End Point.");
            if(!currentGpsLocation) return alert("Waiting for live GPS lock.");

            document.getElementById('destInput').value = "Calculating...";

            var timeout = setTimeout(function() {
                document.getElementById('destInput').value = dest;
                alert("Routing server busy. Try again.");
            }, 6000);

            geocoder.geocode(dest, function(resultsDest) {
                clearTimeout(timeout); 
                if(resultsDest && resultsDest.length > 0) {
                    document.getElementById('destInput').value = dest;
                    routingControl.setWaypoints([currentGpsLocation, resultsDest[0].center]);
                    document.getElementById('routingPanel').classList.add('panel-closed');
                } else {
                    alert("Destination not found.");
                    document.getElementById('destInput').value = dest;
                }
            });
        }
    </script>
</body>
</html>
