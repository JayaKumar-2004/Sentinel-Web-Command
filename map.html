<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha-Suraksha | Advanced Satellite Radar</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        /* TACTICAL MAP FIXES */
        #google-map { background-color: #020c1b; height: calc(100vh - 90px); width: 100vw; z-index: 1; }
        .leaflet-routing-container { display: none !important; }

        /* FLOATING TOGGLE BUTTON */
        #panelToggleBtn {
            position: absolute; top: 100px; right: 15px; z-index: 1001;
            width: auto; background: rgba(2, 12, 27, 0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); margin: 0; padding: 10px 15px;
        }

        /* CUSTOM ROUTING PANEL */
        .custom-routing-panel {
            position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 1000;
            background: rgba(2, 12, 27, 0.9); backdrop-filter: blur(8px);
            border: 1px solid #00E5FF; border-radius: 12px; padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }

        .panel-closed { opacity: 0; visibility: hidden; transform: translate(-50%, -20px); }

        .tactical-input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            background: rgba(16, 24, 32, 0.8); color: #00E5FF;
            border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 6px;
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
        }
        .tactical-input::placeholder { color: #8892b0; }
        .tactical-input:focus { outline: none; border: 1px solid #00E5FF; }

        .btn-row { display: flex; gap: 10px; width: 100%; margin-bottom: 10px; }
        .btn-row button { margin-bottom: 0; padding: 10px 5px; font-size: 0.75rem; width: 50%; }
    </style>
</head>
<body class="no-scroll">

    <div class="rolling-header">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            🔴 RAKSHA-SURAKSHA : OPEN-SOURCE SATELLITE TRACKING & ROUTING ACTIVE 🔴
        </marquee>
    </div>

    <header class="topbar">
        <a href="dashboard.html" class="btn-tactical" style="width: auto; padding: 5px 10px; margin: 0; max-width: none;">⬅️ BACK</a>
        <div class="topbar-logo"><h2>SATELLITE RADAR</h2></div>
        <div class="topbar-account" style="color: #00E676;">GPS ACTIVE</div>
    </header>

    <button id="panelToggleBtn" onclick="toggleRoutingPanel()" class="btn-tactical">
        🗺️ COMMAND PANEL
    </button>

    <div id="routingPanel" class="custom-routing-panel">
        <input type="text" id="originInput" placeholder="Origin Address / Area" class="tactical-input">
        <input type="text" id="destInput" placeholder="Destination Address / Area" class="tactical-input">
        
        <div class="btn-row">
            <button onclick="routeOriginToDest()" class="btn-tactical">📍 ORIGIN ➔ DEST</button>
            <button onclick="routeGpsToDest()" class="btn-tactical" style="border-color: #ff3366; color: #ff3366;">🛰️ GPS ➔ DEST</button>
        </div>
        
        <div class="btn-row" style="margin-top: 10px;">
            <button id="btnTracker" onclick="toggleTracker()" class="btn-tactical" style="border-color: #00E676; color: #00E676;">🟢 TRACKER: ON</button>
            <button onclick="centerMapOnGPS()" class="btn-tactical" style="border-color: #00E5FF; color: #00E5FF;">🎯 CENTER ON ME</button>
        </div>
    </div>

    <div id="google-map"></div>

    <script>
        // 1. MAP SETUP
        var map = L.map('google-map', { zoomControl: false }).setView([12.9716, 77.5946], 12); 
        L.control.zoom({ position: 'bottomright' }).addTo(map); 

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 18
        }).addTo(map);

        function toggleRoutingPanel() {
            document.getElementById('routingPanel').classList.toggle('panel-closed');
        }

        // 2. ROUTING ENGINE SETUP
        var geocoder = L.Control.Geocoder.nominatim();
        var routingControl = L.Routing.control({
            waypoints: [], routeWhileDragging: true, show: false, 
            lineOptions: { styles: [{color: '#ff3366', opacity: 0.8, weight: 5}] },
            createMarker: function() { return null; } 
        }).addTo(map);

        // Catch routing server errors so it doesn't freeze
        routingControl.on('routingerror', function() {
            alert("Routing Server Error: The free public server is busy. Please try again.");
            document.getElementById('originInput').value = "";
            document.getElementById('destInput').value = "";
        });

        // 3. LIVE GPS TRACKING
        var isTracking = true;
        var currentGpsLocation = null;
        var liveMarker = null, liveCircle = null;
        var customGpsIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/149/149059.png', iconSize: [25, 25] });

        map.locate({setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true});

        map.on('locationfound', function(e) {
            currentGpsLocation = e.latlng;
            var radius = e.accuracy / 2;
            
            if (!liveMarker) {
                liveMarker = L.marker(e.latlng, {icon: customGpsIcon}).addTo(map).bindPopup("<b style='color:black;'>📱 DEVICE LOCATED</b>");
                liveCircle = L.circle(e.latlng, radius, {color: '#00E5FF', fillColor: '#00E5FF', fillOpacity: 0.2}).addTo(map);
            } else {
                liveMarker.setLatLng(e.latlng);
                liveCircle.setLatLng(e.latlng);
                liveCircle.setRadius(radius);
            }
        });

        function toggleTracker() {
            var btn = document.getElementById('btnTracker');
            if(isTracking) {
                map.stopLocate(); isTracking = false;
                btn.innerHTML = "⚪ TRACKER: OFF"; btn.style.color = "#8892b0"; btn.style.borderColor = "#8892b0";
                if(liveMarker) map.removeLayer(liveMarker); if(liveCircle) map.removeLayer(liveCircle);
                liveMarker = null; liveCircle = null;
            } else {
                map.locate({setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true});
                isTracking = true;
                btn.innerHTML = "🟢 TRACKER: ON"; btn.style.color = "#00E676"; btn.style.borderColor = "#00E676";
            }
        }

        // NEW: Center Map Button Logic
        function centerMapOnGPS() {
            if (currentGpsLocation) {
                map.setView(currentGpsLocation, 16);
                toggleRoutingPanel(); // Hide panel to see the map
            } else {
                alert("GPS lock not found yet. Ensure location permissions are granted.");
            }
        }

        // 4. ROUTING LOGIC (Origin to Dest with Anti-Spam Delay)
        function routeOriginToDest() {
            var origin = document.getElementById('originInput').value;
            var dest = document.getElementById('destInput').value;
            if(!origin || !dest) return alert("Please enter both Origin and Destination.");

            document.getElementById('originInput').value = "Searching Origin...";
            
            geocoder.geocode(origin, function(resultsOrigin) {
                if(resultsOrigin && resultsOrigin.length > 0) {
                    document.getElementById('originInput').value = "Waiting for Server...";
                    
                    // 1-second delay to prevent free server block
                    setTimeout(function() {
                        document.getElementById('destInput').value = "Searching Dest...";
                        geocoder.geocode(dest, function(resultsDest) {
                            if(resultsDest && resultsDest.length > 0) {
                                document.getElementById('originInput').value = origin;
                                document.getElementById('destInput').value = dest;
                                routingControl.setWaypoints([resultsOrigin[0].center, resultsDest[0].center]);
                                toggleRoutingPanel(); 
                            } else {
                                alert("Destination not found!");
                                document.getElementById('originInput').value = origin;
                                document.getElementById('destInput').value = dest;
                            }
                        });
                    }, 1000); 
                } else {
                    alert("Origin not found! Try adding 'Bengaluru' to the search.");
                    document.getElementById('originInput').value = origin;
                }
            });
        }

        // 5. ROUTING LOGIC (GPS to Dest with Error Handling)
        function routeGpsToDest() {
            var dest = document.getElementById('destInput').value;
            if(!dest) return alert("Please enter a Destination.");
            if(!currentGpsLocation) return alert("Waiting for GPS lock.");

            document.getElementById('destInput').value = "Searching Dest...";

            geocoder.geocode(dest, function(resultsDest) {
                if(resultsDest && resultsDest.length > 0) {
                    document.getElementById('destInput').value = dest;
                    routingControl.setWaypoints([currentGpsLocation, resultsDest[0].center]);
                    toggleRoutingPanel();
                } else {
                    alert("Destination not found! Try adding 'Bengaluru' to the search.");
                    document.getElementById('destInput').value = dest;
                }
            });
        }
    </script>
</body>
</html>
